short_bio: >-
  <p>
    I'm currently a Ph.D. student in NYU's Center for Data Science advised by <a href="https://brianmcfee.net">Prof. Brian McFee</a>.
    My research focuses on understanding the geometry of audio representations learned by deep neural networks.
  </p>
  <p>
    Before starting my Ph.D., I worked with <a href="https://neurostatslab.org">Prof. Alex Williams</a> at the Flatiron Institute to develop tools for neuroscientists studing social vocal behavior, with a focus on
    ensuring our models had a calibrated understanding of how certain they were in their predictions and thus suitible for use in scientific research.
  </p>
  <p>
    Prior to this, I studied neuroscience in my undergraduate career at NYU, where I worked with <a href="https://www.saneslab.com">Prof. Dan Sanes</a> and <a href="https://www.basis.ai/about/people/ralph-peterson/">Dr. Ralph Peterson</a> to study how the gerbil auditory cortex encodes conspecific vocalizations.
  </p>
  <p>
    Outside of work, I'm usually baking or making clothes
  </p>

